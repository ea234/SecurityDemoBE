#
#security.jwt.secret=${JWT_SECRET}
#
security.jwt.secret=L1OldGlHsThfpkNBsbcleBQw+rmp3kvsM0EaZPI4Qpk=
security.jwt.expiration-ms=3600000

#
# Keycloak / OAuth2 Client
#
spring.security.oauth2.client.registration.keycloak.provider=keycloak
spring.security.oauth2.client.registration.keycloak.client-id=securitydemo-be
spring.security.oauth2.client.registration.keycloak.client-secret=VGAjxXgfVZ1f7yhCs508rGzQtMGt4ufoEFSUIAQi7wVyMM6Uu6ulB0QsX0Kv593H7Epr30JVRMs4mVJnFVoSbF
#spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email

spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8180/realms/SecurityDemo